<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Private preview</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{display:grid;place-items:center;padding:28px 20px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#E9EDF6;
 background:radial-gradient(900px 620px at 100% -10%,rgba(199,20,56,.34),transparent 62%),radial-gradient(820px 640px at -12% 110%,rgba(15,110,108,.4),transparent 62%),linear-gradient(160deg,#0A1A3A,#040C1F 72%);background-attachment:fixed}
main{width:100%;max-width:440px}
.mark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
h1{margin-top:22px;font-size:34px;line-height:1.05;letter-spacing:-.035em;font-weight:680;color:#fff}
.lede{margin-top:10px;color:#C6D0E4;max-width:36ch}
form{margin-top:26px}
label{display:block;font-size:14px;font-weight:600;color:#DCE4F2;margin-bottom:8px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;height:52px;padding:0 16px;border-radius:13px;border:1px solid rgba(255,255,255,.3);background:rgba(4,12,31,.6);color:#fff;font:inherit;font-size:17px}
input:focus-visible,button:focus-visible{outline:3px solid #FF8FB3;outline-offset:2px}
button{height:52px;padding:0 22px;border:0;border-radius:13px;background:#C71438;color:#fff;font:inherit;font-weight:650;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.msg{min-height:1.5em;margin-top:12px;font-size:14.5px;color:#FFB7C9}
.msg.ok{color:#9BE5E0}
.own{margin-top:34px;padding-top:16px;border-top:1px solid rgba(255,255,255,.18);font-size:12.5px;line-height:1.55;color:#93A3C2}
.own b{color:#C6D0E4;font-weight:600}
@media (max-width:420px){.row{flex-direction:column}button{width:100%}h1{font-size:30px}}
@media (prefers-reduced-motion:no-preference){button{transition:transform .12s}button:active{transform:scale(.98)}}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9"/></svg></div>
  <h1>Private preview</h1>
  <p class="lede" id="lede">This work is shared for review only. Enter the password you were given to open it.</p>
  <form id="f" autocomplete="on">
    <label for="pw">Password</label>
    <div class="row"><input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus><button id="go" type="submit">Open</button></div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <p class="own"><b>Confidential review copy.</b> © 2026 George Tippetts. All rights reserved. Shared for review only. Not licensed for use, copying or distribution.</p>
</main>
<script>
(function () {
  var BASE = '/Regenerative1/', ID = '676029549224d452', SALT = '4n/cLLBnb7Bzw6tPyYcTrA==', ITER = 600000;
  var $ = function (i) { return document.getElementById(i); }, msg = $('msg'), go = $('go'), pw = $('pw');
  function say(t, ok) { msg.textContent = t; msg.className = 'msg' + (ok ? ' ok' : ''); }
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  function db() { return new Promise(function (ok, no) { var r = indexedDB.open('private-preview', 1); r.onupgradeneeded = function () { r.result.createObjectStore('k'); }; r.onsuccess = function () { ok(r.result); }; r.onerror = function () { no(r.error); }; }); }
  function put(key) { return db().then(function (d) { return new Promise(function (ok, no) { var t = d.transaction('k', 'readwrite'); t.objectStore('k').put({key: key, id: ID, at: Date.now()}, 'key'); t.oncomplete = function () { d.close(); ok(); }; t.onerror = function () { no(t.error); }; }); }); }
  function get() { return db().then(function (d) { return new Promise(function (ok) { var q = d.transaction('k').objectStore('k').get('key'); q.onsuccess = function () { d.close(); ok(q.result); }; q.onerror = function () { ok(null); }; }); }).catch(function () { return null; }); }
  function clear() { return db().then(function (d) { return new Promise(function (ok) { var t = d.transaction('k', 'readwrite'); t.objectStore('k').delete('key'); t.oncomplete = function () { d.close(); ok(); }; t.onerror = ok; }); }).catch(function () {}); }
  function derive(p) { var te = new TextEncoder(); return crypto.subtle.importKey('raw', te.encode(p), 'PBKDF2', false, ['deriveKey']).then(function (m) {
    return crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256'}, m, {name: 'AES-GCM', length: 256}, false, ['decrypt']); }); }
  function works(key) { return fetch(BASE + 'check.enc', {cache: 'no-store'}).then(function (r) { return r.arrayBuffer(); }).then(function (raw) {
    return crypto.subtle.decrypt({name: 'AES-GCM', iv: raw.slice(0, 12)}, key, raw.slice(12)); }).then(function () { return true; }, function () { return false; }); }
  function settled(reg) {       /* a newer worker (after a password change) must take over before the page is asked for again */
    return new Promise(function (ok) { var n = 0; (function wait() { if ((!reg.installing && !reg.waiting && reg.active) || n++ > 60) ok(reg); else setTimeout(wait, 100); })(); }); }
  function enter() {            /* hand over to the worker, then load the page that was asked for */
    return navigator.serviceWorker.register(BASE + 'sw.js', {scope: BASE}).then(function (reg) { return reg.update().catch(function () {}).then(function () { return settled(reg); }); }).then(function (reg) {
      if (reg.active) reg.active.postMessage('unlocked');
      var n = +(sessionStorage.getItem('pp-tries') || 0); sessionStorage.setItem('pp-tries', n + 1);
      if (n > 3) { go.disabled = false; say('Almost there. Close this tab and open the link again.'); return; }
      var gone = false, done = function () { if (gone) return; gone = true; location.replace(location.href.replace(/[?#]lock$/, '')); };
      if (navigator.serviceWorker.controller) setTimeout(done, 150); else { navigator.serviceWorker.addEventListener('controllerchange', done); setTimeout(done, 2000); }
    });
  }
  if (!('serviceWorker' in navigator) || !window.crypto || !crypto.subtle || !window.indexedDB) {
    $('f').hidden = true; $('lede').textContent = 'This preview cannot open in this window. Open the link in Safari or Chrome, in a regular window (not private browsing, and not inside another app).'; return;
  }
  if (/[?#]lock$/.test(location.href)) {        /* add ?lock to the address to lock this browser again */
    clear().then(function () { return navigator.serviceWorker.getRegistrations(); }).then(function (rs) { rs.forEach(function (r) { if (r.active) r.active.postMessage('lock'); }); say('This browser is locked again.', true); });
  } else {
    get().then(function (v) { if (v && v.key && v.id === ID) return works(v.key).then(function (ok) { if (ok) { go.disabled = true; say('Opening.', true); return enter(); } return clear(); }); });
  }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault(); if (!pw.value) return; go.disabled = true; say('Checking.', true);
    derive(pw.value.trim()).then(function (key) { return works(key).then(function (ok) {
      if (!ok) { go.disabled = false; say('That password did not open it. Check it and try again.'); pw.select(); return; }
      sessionStorage.removeItem('pp-tries'); say('Opening.', true); return put(key).then(enter); }); })
    .catch(function () { go.disabled = false; say('Something went wrong in this browser. Try Safari or Chrome in a regular window.'); });
  });
})();
</script>
</body>
</html>
